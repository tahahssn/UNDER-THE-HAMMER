# Local development services only. Credentials here are local-only throwaways.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: uth
      POSTGRES_PASSWORD: uth_local_only
      POSTGRES_DB: uth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uth"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
